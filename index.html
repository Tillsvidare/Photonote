<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#533483">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Photonote">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Photonote</title>
</head>
<body>

  <header>
    <h1>Photonote</h1>
    <span class="version">v7</span>
  </header>

  <main id="gallery" class="gallery"></main>

  <button id="capture-btn" class="fab" aria-label="Ta foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </button>

  <!-- In-app kameravy (getUserMedia) -->
  <div id="camera-view" class="camera-view hidden">
    <video id="cam-video" autoplay playsinline muted></video>
    <button id="cam-close" class="cam-close" aria-label="Stäng">&#x2715;</button>
    <button id="cam-shutter" class="cam-shutter" aria-label="Ta foto"></button>
  </div>

  <!-- Fallback file input om getUserMedia saknas -->
  <input type="file" id="file-fallback" accept="image/*" capture="environment" style="display:none">

  <!-- Modal: förhandsgranskning + anteckning -->
  <div id="capture-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header"><h2>Nytt foto</h2></div>
      <div class="preview-area">
        <img id="preview-img" alt="Förhandsgranskning">
        <button id="retake-btn" class="retake-btn">Ta om</button>
      </div>
      <div class="note-section">
        <textarea id="note-input" placeholder="Skriv en anteckning (syns i den sparade bilden)..." rows="4" maxlength="500"></textarea>
      </div>
      <div class="modal-actions">
        <button id="cancel-btn" class="btn btn-secondary">Avbryt</button>
        <button id="save-btn" class="btn btn-primary">Spara &amp; ladda ner</button>
      </div>
    </div>
  </div>

  <!-- Modal: visa/redigera -->
  <div id="view-modal" class="modal hidden">
    <div class="modal-content view-modal-content">
      <img id="view-img" alt="Foto">
      <div class="note-section">
        <textarea id="view-note" placeholder="Skriv en anteckning..." rows="4" maxlength="500"></textarea>
      </div>
      <div class="view-date" id="view-date"></div>
      <div class="modal-actions">
        <button id="delete-btn" class="btn btn-danger">Radera</button>
        <div class="action-right">
          <button id="download-btn" class="btn btn-secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15" style="vertical-align:middle;margin-right:3px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Spara
          </button>
          <button id="close-btn" class="btn btn-secondary">Stäng</button>
          <button id="update-btn" class="btn btn-primary">Uppdatera</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
